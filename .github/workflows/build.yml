# 建出使用者真的會下載的那幾個檔案，並且在每一個平台上跑測試。
#
# 為什麼要有 macOS runner：工具列那個小東西在 macOS 上是 Objective-C（systray
# 走 Cgo），**只有 Mac 編得出來**。Linux 與 Windows 那兩個目標是純 Go，交叉編譯
# 就夠，所以它們都在 ubuntu 上做完，只有 darwin 需要真的 Mac。
#
# 產出分兩種，不要混在一起：
#   rabi-*      daemon 本體，常駐、維持連線
#   Rabi-*      工具列小工具，只是看板加兩顆按鈕，關掉它不會讓電腦離線

name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # gofmt 不會自己失敗，它只是列出檔案 —— 所以要自己把清單變成退出碼。
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  daemon:
    name: daemon binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          # 純 Go，所以五個目標都能在這一台上做完。
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/rabi-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "$out" .
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: rabi-daemon
          path: dist/*

  tray-windows:
    name: tray (Windows)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # systray 在 Windows 是純 Go（Win32 syscall），所以這一個不必開 Windows
      # runner。只有 darwin 那一個非得用 Mac 不可。
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o Rabi-windows-amd64.exe ./cmd/menubar
      - uses: actions/upload-artifact@v4
        with:
          name: Rabi-windows
          path: Rabi-windows-amd64.exe

  tray-macos:
    name: tray (macOS)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          for arch in arm64 amd64; do
            GOARCH="$arch" go build -trimpath -o "Rabi-darwin-${arch}" ./cmd/menubar
          done
          # 一個真的能雙擊的東西：macOS 只有 .app 才會出現在選單列而不是
          # 在 Dock 裡開一個沒有視窗的程式。LSUIElement 就是那一行。
          for arch in arm64 amd64; do
            app="Rabi-${arch}.app"
            mkdir -p "$app/Contents/MacOS"
            cp "Rabi-darwin-${arch}" "$app/Contents/MacOS/Rabi"
            cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Rabi</string>
            <key>CFBundleExecutable</key><string>Rabi</string>
            <key>CFBundleIdentifier</key><string>com.unieai.rabi.tray</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.2.0</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
            # heredoc 為了對齊縮排了，plist 不能有前導空白。
            sed -i '' 's/^          //' "$app/Contents/Info.plist"
            ditto -c -k --keepParent "$app" "Rabi-darwin-${arch}.app.zip"
          done
          ls -la Rabi-*
      - uses: actions/upload-artifact@v4
        with:
          name: Rabi-macos
          path: |
            Rabi-darwin-*
            !Rabi-*.app
